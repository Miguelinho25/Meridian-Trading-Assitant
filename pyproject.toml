[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemonis"
version = "0.1.0"
description = "Forex research, backtesting and risk-control platform"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "greenlet>=3.1",  # required by SQLAlchemy's async bridge
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "python-ulid>=3.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
quant = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pyarrow>=18.0",
]
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.2"]
# Optional: historical data import. Yahoo data is for personal research use;
# check its terms before relying on it for anything else.
data = ["yfinance>=0.2.50"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

# Each brief-mandated directory holds one underscore-named Python package.
# `where` takes a list, so the hyphenated layout from the brief is preserved
# while imports stay valid: `from nemonis_config import settings`.
[tool.setuptools.packages.find]
where = [
    "packages/config",
    "packages/schemas",
    "packages/persistence",
    "packages/model-router",
    "packages/obsidian-memory",
    "services/market-data",
    "services/feature-pipeline",
    "services/strategy-engine",
    "services/risk-engine",
    "services/backtest-engine",
    "services/paper-broker",
    "services/paper-trading",
    "services/journal-engine",
    "services/analytics-engine",
    "apps/api",
    "apps/worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:nemonis_.*"]
markers = [
    "risk: risk-engine tests (must pass before any risk change)",
    "determinism: replay-determinism tests",
    "postgres: requires NEMONIS_TEST_POSTGRES_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = ["A003"]

# "×" is intentional typography in operator-facing messages, not a mistyped "x".
allowed-confusables = ["×", "—", "–", "…"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N801", "RUF012"]
# Alembic's template supplies op, sa and nemonis_db.types to every generated
# migration, and sorts them its own way. A migration that happens not to need one
# is not defective, and hand-editing generated files to satisfy the linter is
# churn that recurs on every schema change — it was fixed by hand three times
# before this exemption existed.
"migrations/versions/*.py" = ["F401", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyarrow ships no stubs and is an optional extra — see [project.optional-dependencies].
module = ["pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Import boundaries — ADR-0004. These are the structural safety guarantees.
# ---------------------------------------------------------------------------
# Contracts cover only packages that exist. The risk-engine and model-router
# contracts below are written out ready and must be uncommented as those
# packages land (Stage C and Stage F) — they encode the guarantee that no LLM
# code path can reach the risk engine.
[tool.importlinter]
# Needed to forbid external modules (httpx, socket) in the risk engine.
include_external_packages = true
root_packages = [
    "nemonis_config", "nemonis_schemas", "nemonis_db", "nemonis_api",
    "nemonis_marketdata", "nemonis_features", "nemonis_risk",
    "nemonis_vault", "nemonis_router", "nemonis_broker",
    "nemonis_backtest", "nemonis_strategy", "nemonis_paper",
]

[[tool.importlinter.contracts]]
name = "Config is the lowest layer and depends on nothing internal"
type = "forbidden"
source_modules = ["nemonis_config"]
forbidden_modules = ["nemonis_schemas", "nemonis_db", "nemonis_api"]

[[tool.importlinter.contracts]]
name = "Schemas never depend on persistence or the application layer"
type = "forbidden"
source_modules = ["nemonis_schemas"]
forbidden_modules = ["nemonis_db", "nemonis_api"]

[[tool.importlinter.contracts]]
name = "Persistence never imports the application layer"
type = "forbidden"
source_modules = ["nemonis_db"]
forbidden_modules = ["nemonis_api"]

# --- Active from Stage C -------------------------------------------------
[[tool.importlinter.contracts]]
name = "Risk engine performs no I/O and never touches the database"
type = "forbidden"
source_modules = ["nemonis_risk"]
forbidden_modules = ["httpx", "requests", "socket", "urllib", "nemonis_db", "nemonis_api"]

[[tool.importlinter.contracts]]
name = "Market data and features never import the application or persistence layers"
type = "forbidden"
source_modules = ["nemonis_marketdata", "nemonis_features"]
forbidden_modules = ["nemonis_api", "nemonis_db"]

# --- Active from Stage F -------------------------------------------------
# The contract that makes "no LLM can influence sizing" a property of the build
# rather than a promise. Neither direction is permitted: the risk engine cannot
# import the router, and the router cannot import the risk engine.
[[tool.importlinter.contracts]]
name = "Risk engine and model router cannot reach each other"
type = "forbidden"
source_modules = ["nemonis_risk"]
forbidden_modules = ["nemonis_router"]

[[tool.importlinter.contracts]]
name = "Model router cannot reach the risk engine or the broker"
type = "forbidden"
source_modules = ["nemonis_router"]
forbidden_modules = ["nemonis_risk", "nemonis_broker", "nemonis_db"]

[[tool.importlinter.contracts]]
name = "Vault writes never touch persistence or the application layer"
type = "forbidden"
source_modules = ["nemonis_vault"]
forbidden_modules = ["nemonis_db", "nemonis_api"]

# --- Safety principles as enforced structure -------------------------------
# The three contracts below were added after an audit found the strategy,
# broker and backtest packages had the correct dependency shape but nothing
# enforcing it. Convention is not a control; each of these encodes a principle
# from the brief that must fail at lint time rather than in review.

[[tool.importlinter.contracts]]
# Brief: "the risk engine has final authority and cannot be overridden by
# prompts, models, strategies or UI controls." A strategy that could import the
# risk engine could read or pre-empt its own sizing; one that could import the
# broker could bypass it entirely. Strategies propose. Nothing else.
name = "Strategies propose only — never size, execute, persist or call a model"
type = "forbidden"
source_modules = ["nemonis_strategy"]
forbidden_modules = [
    "nemonis_risk", "nemonis_broker", "nemonis_db",
    "nemonis_router", "nemonis_api",
]

[[tool.importlinter.contracts]]
# A model call inside the replay loop would make backtests irreproducible:
# same seed, same data, different answer. Determinism is the property that
# makes every validation statistic in docs/backtesting-methodology.md mean
# anything, so the LLM layer must be unreachable from here.
name = "Backtests stay deterministic — no model layer inside the replay loop"
type = "forbidden"
source_modules = ["nemonis_backtest"]
forbidden_modules = ["nemonis_router", "nemonis_api", "nemonis_db"]

[[tool.importlinter.contracts]]
# Brief: "no language model may directly submit an order to a broker." The
# router contract forbids that direction; this forbids the reverse, so there is
# no path between the two regardless of which side initiates.
name = "The broker is reachable only through risk — never from a model or strategy"
type = "forbidden"
source_modules = ["nemonis_broker"]
forbidden_modules = ["nemonis_router", "nemonis_api", "nemonis_strategy"]
